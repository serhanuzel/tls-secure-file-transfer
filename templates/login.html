<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure File System - Login</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 50px; text-align: center; background-color: #f4f4f4;">
    <div style="max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1);">
        <h2>Secure File Transfer</h2>
        <p style="color: #666;">Web Dashboard Access</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <p style="color: red; font-weight: bold;">{{ messages[0] }}</p>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required style="width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px;"><br>
            <input type="password" name="password" placeholder="Password" required style="width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px;"><br>
            <button type="submit" style="width: 85%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Sign In</button>
        </form>
    </div>
</body>
</html>
